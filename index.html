<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGC Groups</title>
<style>
:root{
  --bg:#f5f5f5; --tile:#e3e3e3; --text:#000; --muted:#595959; --line:#cfcfcf; --accent:#000; --on-accent:#f5f5f5;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1e1e1e; --tile:#0c0c0c; --text:#fff; --muted:#a3a3a3; --line:#333; --accent:#fff; --on-accent:#0c0c0c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:var(--text)}
button{background:transparent;border:1px solid var(--text);padding:6px 14px;cursor:pointer;border-radius:999px}
button:hover{background:var(--text);color:var(--bg)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,4vw,48px)}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,48px);display:grid;gap:10px}
.controls{display:flex;flex-wrap:wrap;gap:10px}
.controls input,.controls select{background:var(--tile);border:1px solid transparent;border-radius:999px;padding:8px 14px;min-width:0}
.controls input{flex:1 1 220px}
.controls input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;font-size:.88rem;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

main{padding:20px clamp(16px,4vw,48px) 64px}
.count{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--tile);border-radius:14px;padding:10px;display:block}
.tile:hover{box-shadow:0 0 0 1px var(--text)}
.tile:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tile .img,.tile .ph{aspect-ratio:1;width:100%;display:block;object-fit:contain;border-radius:8px}
.tile .name{margin:8px 0 2px;font-size:.9rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)}
.msg{padding:48px 0;color:var(--muted)}
footer{padding:0 clamp(16px,4vw,48px) 32px;color:var(--muted);font-size:.85rem}

dialog{border:0;padding:0;background:var(--bg);color:var(--text);border-radius:18px;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;padding:24px;position:relative}
.detail .pic{background:var(--tile);border-radius:14px;padding:12px;align-self:start}
.detail .pic img,.detail .pic div{width:100%;aspect-ratio:1;display:block;object-fit:contain}
.detail h2{margin:0 36px 4px 0;font-size:1.5rem;line-height:1.2}
.detail .by{margin:0 0 16px;color:var(--muted)}
.detail .price{font-size:1.75rem;font-weight:700;margin:0 0 4px}
.detail .fav{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.detail .desc{margin:0 0 20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:30vh;overflow:auto}
.buy{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;padding:12px 28px;border-radius:999px;font-weight:700}
.buy:hover{opacity:.85}
.x{position:absolute;top:16px;right:16px;width:36px;height:36px;padding:0;line-height:1;font-size:1.1rem}
@media (max-width:600px){.detail{grid-template-columns:1fr;padding:16px}}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>
<body>
<header>
  <div>
    <h1>UGC Groups</h1>
    <p class="sub" id="sub"></p>
  </div>
  <button id="theme" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
</header>

<div class="bar">
  <div class="controls">
    <input id="q" type="search" placeholder="Search items" aria-label="Search items">
    <select id="sort" aria-label="Sort items">
      <option value="latest">Latest arrivals</option>
      <option value="best">Best selling</option>
      <option value="fav">Top favorited</option>
    </select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
</div>

<main>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"><p class="msg">Loading…</p></div>
</main>
<footer id="foot"></footer>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="detail">
    <button class="x" id="d-close" type="button" aria-label="Close">✕</button>
    <div class="pic" id="d-pic"></div>
    <div>
      <h2 id="d-name"></h2>
      <p class="by" id="d-by"></p>
      <p class="price" id="d-price"></p>
      <p class="fav" id="d-fav"></p>
      <p class="desc" id="d-desc"></p>
      <a class="buy" id="d-buy" target="_blank" rel="noopener">Buy on Roblox</a>
    </div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const themeBtn = $("theme");

function setTheme(t){
  root.dataset.theme = t;
  themeBtn.textContent = t === "dark" ? "Light mode" : "Dark mode";
  try { localStorage.setItem("theme", t); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

function el(tag, props = {}, ...kids){
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}

const state = { q: "", sort: "latest", group: "all" };
let items = [], groups = [];
const BIG = 1e6;

// Merge the three per-group lists into one deduplicated list of items.
function build(data){
  groups = data.groups;
  const map = new Map();
  groups.forEach((g, gi) => {
    const add = (list, key) => (list || []).forEach((it, idx) => {
      let o = map.get(it.id);
      if (!o) { o = { ...it, groupId: g.id, groupName: g.name, gi, rank: {} }; map.set(it.id, o); }
      else for (const k of ["price", "priceStatus", "description", "creator"]) if (o[k] == null && it[k] != null) o[k] = it[k];
      o.rank[key] = idx;
    });
    add(g.latest, "latest"); add(g.bestSelling, "best"); add(g.favorited, "fav");
  });
  items = [...map.values()];
}

function priceText(i){
  if (typeof i.price === "number") return i.price === 0 ? "Free" : "R$ " + i.price.toLocaleString();
  if (i.priceStatus) return i.priceStatus;
  return "See price on Roblox";
}

function visible(){
  const q = state.q.trim().toLowerCase();
  const list = items.filter(i =>
    (state.group === "all" || String(i.groupId) === state.group) &&
    (!q || i.name.toLowerCase().includes(q) || i.groupName.toLowerCase().includes(q)));
  const s = state.sort;
  return list.sort((a, b) => s === "fav"
    ? b.favorites - a.favorites
    : (a.rank[s] ?? BIG) - (b.rank[s] ?? BIG) || a.gi - b.gi || b.favorites - a.favorites);
}

function tile(i){
  const b = el("button", { className: "tile", type: "button" });
  b.append(i.image ? el("img", { className: "img", src: i.image, alt: "", loading: "lazy" }) : el("div", { className: "ph" }));
  b.append(el("div", { className: "name", textContent: i.name }));
  b.append(el("div", { className: "meta" }, el("span", { textContent: typeof i.price === "number" ? priceText(i) : i.groupName }), el("span", { textContent: "★ " + Number(i.favorites).toLocaleString() })));
  b.addEventListener("click", () => openItem(i));
  return b;
}

function render(){
  const list = visible();
  $("grid").replaceChildren(...(list.length ? list.map(tile) : [el("p", { className: "msg", textContent: "No items match your search." })]));
  $("count").textContent = list.length + (list.length === 1 ? " item" : " items");
}

function renderChips(){
  const defs = [{ id: "all", name: "All groups" }, ...groups.map(g => ({ id: String(g.id), name: g.name }))];
  $("chips").replaceChildren(...defs.map(d => {
    const c = el("button", { className: "chip", type: "button", textContent: d.name });
    c.setAttribute("aria-pressed", String(state.group === d.id));
    c.addEventListener("click", () => { state.group = d.id; renderChips(); render(); });
    return c;
  }));
}

const dlg = $("dlg");
function openItem(i){
  $("d-pic").replaceChildren(i.image ? el("img", { src: i.image, alt: i.name }) : el("div"));
  $("d-name").textContent = i.name;
  const by = el("a", { href: "https://www.roblox.com/communities/" + i.groupId, target: "_blank", rel: "noopener", textContent: i.creator || i.groupName });
  $("d-by").replaceChildren("By ", by);
  $("d-price").textContent = priceText(i);
  $("d-fav").textContent = "★ " + Number(i.favorites).toLocaleString() + " favorites";
  $("d-desc").textContent = i.description || "No description available.";
  const buy = $("d-buy");
  buy.href = "https://www.roblox.com/catalog/" + i.id;
  buy.textContent = i.priceStatus === "Off Sale" ? "View on Roblox" : "Buy on Roblox";
  dlg.showModal();
}
$("d-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });

fetch("data.json").then(r => r.json()).then(data => {
  if (!data.groups.length) {
    $("grid").replaceChildren(el("p", { className: "msg", textContent: "No items yet. In your repository, open Actions, choose “Update items”, and click Run workflow." }));
    return;
  }
  build(data);
  $("sub").textContent = items.length + " items from " + groups.length + " groups";
  renderChips();
  render();
  if (data.updated) $("foot").textContent = "Updated " + new Date(data.updated).toLocaleString();
}).catch(() => {
  $("grid").replaceChildren(el("p", { className: "msg", textContent: "Could not load data.json." }));
});
</script>
</body>
</html>
