<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8O8 Studios</title>
<style>
:root{
  --bg:#080810; --bg-grad:linear-gradient(155deg,#171323 0%,#0c1020 52%,#07080f 100%);
  --text:#f4f1ff; --muted:#aaa6bf; --line:rgba(167,145,255,.18);
  --g1:rgba(91,75,143,.34); --g2:rgba(24,38,75,.25); --edge:rgba(157,133,255,.25); --hi:rgba(172,151,255,.7); --shadow:rgba(0,0,0,.65);
  --gloss:rgba(207,193,255,.2); --inset:rgba(82,91,166,.16); --dot:rgba(160,139,255,.18); --blob:rgba(113,91,210,.15);
  --panel:linear-gradient(145deg,rgba(37,29,62,.97),rgba(12,19,39,.98));
  --buy-bg:linear-gradient(115deg,#8b5cf6,#4263d8); --buy-fg:#fff;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.012em;min-height:100vh}
a{color:inherit}
button,select,input{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid #a98aff;outline-offset:4px}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg-grad)}
.bg i{position:absolute;width:58vmax;height:58vmax;border-radius:50%;background:var(--blob);filter:blur(110px);will-change:transform;opacity:.7}
.bg i:nth-child(1){top:-20vmax;left:-12vmax;background:rgba(133,91,255,.18)}
.bg i:nth-child(2){top:12vmax;right:-22vmax;background:rgba(55,112,255,.16)}
.bg i:nth-child(3){bottom:-28vmax;left:28vw;background:rgba(111,72,200,.15)}

button,.tile,.buy,.bar input,.bar select{
  position:relative;
  background:linear-gradient(160deg,var(--g1),var(--g2));
  border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--edge),inset 0 0 14px rgba(255,255,255,.04),0 8px 22px -8px var(--shadow);
}
button::before,.tile::before,.buy::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--gloss) 0%,transparent 48%);opacity:.5;transition:opacity .35s;
}
button:hover::before,.tile:hover::before,.buy:hover::before{opacity:.95}

button{border-radius:999px;cursor:pointer;padding:8px 18px;overflow:hidden;
  transition:transform .45s var(--spring),box-shadow .35s,border-color .3s,background .3s,color .3s}
button:hover{transform:translateY(-2px) scale(1.04);border-color:var(--hi);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--edge),inset 0 0 18px rgba(255,255,255,.08),0 14px 28px -10px var(--shadow)}
button:active{transform:scale(.93);transition-duration:.12s}

.hero{padding:clamp(28px,6vw,64px) clamp(16px,4vw,48px) 20px;text-align:center;max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.eyebrow{margin:0 0 13px;color:#a995ed;font-size:.7rem;font-weight:800;letter-spacing:.22em}
h1{margin:0;font-size:clamp(3.4rem,11vw,8.4rem);line-height:.88;letter-spacing:-.085em;font-weight:900}
h1 span{
  background:linear-gradient(100deg,#f4f1ff 0%,#b69aff 42%,#6f9bff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 8px 42px rgba(119,91,255,.16);
}
.tagline{margin:20px auto 0;color:var(--muted);font-size:clamp(.95rem,2vw,1.08rem);max-width:600px}
.group-heading{
  display:flex;align-items:center;gap:14px;margin:18px auto 13px;
  color:#aaa0d2;font-size:.67rem;font-weight:800;letter-spacing:.18em;max-width:900px;
}
.group-line{height:1px;flex:1;background:linear-gradient(90deg,rgba(155,124,255,.4),rgba(72,112,220,.08),transparent)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;max-width:1000px;margin:0 auto;gap:9px}
.chip{padding:9px 16px;font-size:.84rem;font-weight:650;display:inline-flex;align-items:center;gap:8px}
.chip .led{position:relative;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#b78aff,#5794ff);opacity:.8;transition:transform .4s var(--spring)}
.chip[aria-pressed="true"]{
  color:#fff; border-color:rgba(174,146,255,.75);
  background:linear-gradient(120deg,rgba(126,82,220,.58),rgba(54,91,190,.48));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 26px rgba(94,69,200,.2);
}

.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;padding:12px clamp(16px,4vw,48px);
  background:linear-gradient(100deg,rgba(18,15,35,.88),rgba(11,20,42,.88));
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(157,133,255,.2);box-shadow:0 12px 35px -28px var(--shadow)}
.bar input,.bar select{border-radius:999px;padding:10px 18px;min-height:44px;min-width:0;transition:border-color .3s,box-shadow .3s}
.bar input{flex:1 1 220px}
.bar input::placeholder{color:var(--muted)}
.bar input:focus,.bar select:focus{border-color:#9b7cff;outline:none;box-shadow:0 0 0 3px rgba(139,108,255,.17)}
.bar select{cursor:pointer}
.bar select option{color:#000}

main{padding:20px clamp(16px,4vw,48px) 64px}
.count{margin:0 0 20px;color:var(--muted);font-size:.9rem}

/* Container holding all horizontal category rows */
.rows-container {
  display: flex;
  flex-direction: column;
  gap: 32px;
  width: 100%;
}

/* Individual Category Row Box */
.category-row {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(157,133,255,.15);
  border-radius: 24px;
  padding: 18px 20px;
}

.category-title {
  font-size: 1.15rem;
  font-weight: 800;
  margin: 0;
  color: var(--text);
  letter-spacing: -.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.category-title span {
  font-size: .8rem;
  color: #a995ed;
  font-weight: 700;
}

/* Horizontal Sideways Scrolling Track */
.row-items {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  gap: 16px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 4px 2px 14px;
  width: 100%;
  scrollbar-width: auto;
  scrollbar-color: rgba(157,133,255,.4) rgba(255,255,255,.05);
}
.row-items::-webkit-scrollbar { height: 10px; }
.row-items::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 999px; }
.row-items::-webkit-scrollbar-thumb { background: rgba(157,133,255,.4); border-radius: 999px; border: 2px solid rgba(24,19,40,.9); }

/* Item Card Sizing */
.tile {
  all: unset;
  box-sizing: border-box;
  position: relative;
  cursor: pointer;
  display: block;
  flex: 0 0 180px;
  width: 180px;
  padding: 11px;
  border-radius: 20px;
  overflow: hidden;
  background: linear-gradient(145deg,rgba(47,37,75,.76),rgba(17,27,52,.8));
  border: 1px solid rgba(151,132,224,.22);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  backdrop-filter: blur(18px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--edge),0 8px 20px -10px var(--shadow);
  transition: transform .4s var(--spring),box-shadow .3s,border-color .3s;
}
.tile:hover {
  transform: translateY(-4px) scale(1.02);
  border-color: rgba(154,132,255,.8);
  box-shadow: inset 0 1px 0 rgba(220,210,255,.24),0 14px 30px -10px rgba(71,65,170,.5);
}
.tile .frame {
  position: relative;
  background: linear-gradient(145deg,rgba(91,70,145,.22),rgba(37,67,125,.2));
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 1;
}
.tile .img, .tile .ph {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  transition: transform .4s var(--ease);
}
.tile:hover .img { transform: scale(1.08); }
.tile .name {
  position: relative;
  margin: 8px 2px 3px;
  font-size: .88rem;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.5em;
}
.tile .meta {
  position: relative;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin: 0 2px;
  font-size: .78rem;
  color: var(--muted);
}
.msg { padding: 48px 0; color: var(--muted); text-align: center; width: 100%; }
footer { padding: 0 clamp(16px,4vw,48px) 32px; color: var(--muted); font-size: .85rem; }

dialog {
  border: 1px solid var(--edge);
  padding: 0;
  background: var(--panel);
  color: var(--text);
  border-radius: 28px;
  width: min(780px,calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow: auto;
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--hi),0 40px 90px -20px rgba(0,0,0,.8);
}
dialog::backdrop { background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.detail { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.1fr); gap: 26px; padding: 26px; position: relative; }
.detail .pic { background: var(--inset); border-radius: 20px; padding: 12px; align-self: start; box-shadow: inset 0 1px 0 var(--hi); }
.detail .pic img, .detail .pic div { width: 100%; aspect-ratio: 1; display: block; object-fit: contain; }
.detail h2 { margin: 0 44px 4px 0; font-size: 1.6rem; line-height: 1.15; letter-spacing: -.02em; }
.detail .by { margin: 0 0 16px; color: var(--muted); }
.detail .by a { text-underline-offset: 3px; transition: color .2s; }
.detail .by a:hover { color: var(--text); }
.detail .price { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; color: #a995ed; }
.detail .fav { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
.detail .desc { margin: 0 0 22px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; }
.buy {
  display: inline-block;
  overflow: hidden;
  text-decoration: none;
  font-weight: 800;
  color: var(--buy-fg);
  padding: 14px 32px;
  border-radius: 999px;
  background: var(--buy-bg);
  border-color: rgba(195,177,255,.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px -10px rgba(91,78,220,.5);
  transition: transform .45s var(--spring),box-shadow .35s;
}
.buy:hover { transform: translateY(-3px) scale(1.04); box-shadow: inset 0 1px 0 rgba(255,255,255,.4),0 16px 38px -10px rgba(75,112,255,.55); }
.x { position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; padding: 0; line-height: 1; font-size: 1.05rem; }
.x:hover { transform: rotate(90deg) scale(1.06); border-color: #a98aff; }

.social-links { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
.social-links a {
  width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: #e9e3ff;
  background: linear-gradient(145deg,rgba(112,83,190,.3),rgba(36,64,130,.28));
  border: 1px solid rgba(169,145,255,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.18),0 8px 22px -12px rgba(89,77,210,.65);
  transition: transform .25s ease,border-color .25s ease;
}
.social-links a:hover { transform: translateY(-3px); border-color: rgba(184,158,255,.8); background: linear-gradient(145deg,rgba(130,91,220,.5),rgba(49,91,180,.45)); }
.social-links svg { width: 21px; height: 21px; display: block; }
@media(max-width:600px){ .detail { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="hero">
  <div class="top">
    <span class="status"><span class="status-dot"></span><span id="sub">Loading…</span></span>
    <nav class="social-links" aria-label="Social links">
      <a href="https://www.roblox.com/communities/33198659/8O8-Studios" target="_blank" rel="noopener noreferrer" title="Roblox">
        <svg viewBox="0 0 24 24"><path d="M5.1 1.8 22.2 5.1 18.9 22.2 1.8 18.9 5.1 1.8Z" fill="currentColor" transform="rotate(15 12 12)"/><path d="m10 9.2 4.8.9-.9 4.8-4.8-.9.9-4.8Z" fill="#11101c" transform="rotate(15 12 12)"/></svg>
      </a>
      <a href="https://x.com/8O8Studios" target="_blank" rel="noopener noreferrer" title="X / Twitter">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.4l7.3-8.4L1.9 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L7.4 3.9H5.6L17.8 20Z"/></svg>
      </a>
      <a href="https://www.instagram.com/8o8studiosofficial/" target="_blank" rel="noopener noreferrer" title="Instagram">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.7" cy="6.5" r="1.2" fill="currentColor"/></svg>
      </a>
    </nav>
  </div>
  <div class="brand">
    <p class="eyebrow">THE OFFICIAL 8O8 STUDIOS HUB</p>
    <h1>8O8 <span>Studios</span></h1>
    <p class="tagline">Explore items categorized by accessory type.</p>
  </div>
  <div class="group-heading">
    <span>EXPLORE OUR GROUPS</span>
    <span class="group-line"></span>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Search items across categories" aria-label="Search items">
  <select id="sort" aria-label="Sort items">
    <option value="latest">Latest arrivals</option>
    <option value="best">Best selling</option>
    <option value="fav">Top favorited</option>
  </select>
</div>

<main>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="rows-container" id="board"></div>
</main>
<footer id="foot"></footer>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="detail">
    <button class="x" id="d-close" type="button" aria-label="Close">✕</button>
    <div class="pic" id="d-pic"></div>
    <div>
      <h2 id="d-name"></h2>
      <p class="by" id="d-by"></p>
      <p class="price" id="d-price"></p>
      <p class="fav" id="d-fav"></p>
      <p class="desc" id="d-desc"></p>
      <a class="buy" id="d-buy" target="_blank" rel="noopener">Buy on Roblox</a>
    </div>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
root.dataset.theme = "dark";

function el(tag, props = {}, ...kids){
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}

const state = { q: "", sort: "latest", group: "all" };
let items = [], groups = [];

function build(data){
  groups = data.groups;
  const map = new Map();
  groups.forEach((g) => {
    const add = (list) => (list || []).forEach((it) => {
      if (!map.has(it.id)) {
        map.set(it.id, { ...it, groupId: g.id, groupName: g.name });
      }
    });
    add(g.latest); add(g.bestSelling); add(g.favorited);
  });
  items = [...map.values()];
}

function priceText(i){
  if (typeof i.price === "number") return i.price === 0 ? "Free" : "R$ " + i.price.toLocaleString();
  if (i.priceStatus) return i.priceStatus;
  return "See price on Roblox";
}

function tile(i){
  const b = el("button", { className: "tile", type: "button" });
  const frame = el("div", { className: "frame" }, i.image ? el("img", { className: "img", src: i.image, alt: "", loading: "lazy" }) : el("div", { className: "ph" }));
  b.append(frame);
  b.append(el("div", { className: "name", textContent: i.name }));
  b.append(el("div", { className: "meta" }, el("span", { textContent: priceText(i) }), el("span", { textContent: "★ " + Number(i.favorites).toLocaleString() })));
  b.addEventListener("click", () => openItem(i));
  return b;
}

function render(){
  const q = state.q.trim().toLowerCase();
  let list = items.filter(i =>
    (state.group === "all" || String(i.groupId) === state.group) &&
    (!q || i.name.toLowerCase().includes(q) || i.groupName.toLowerCase().includes(q) || (i.category && i.category.toLowerCase().includes(q))));

  const s = state.sort;
  if (s === "fav" || s === "best") {
    list.sort((a, b) => b.favorites - a.favorites);
  }

  const board = $("board");
  board.replaceChildren();

  if (list.length === 0) {
    board.replaceChildren(el("p", { className: "msg", textContent: "No items match your search." }));
    $("count").textContent = "0 items";
    return;
  }

  const categoryOrder = [
    "Hats", 
    "Hair", 
    "Face Accessories", 
    "Neck Accessories", 
    "Front Accessories", 
    "Back Accessories", 
    "Waist Accessories", 
    "Shoulder Accessories", 
    "Emotes", 
    "Clothing", 
    "Other Accessories"
  ];

  categoryOrder.forEach(cat => {
    const catItems = list.filter(i => (i.category || "Other Accessories") === cat);
    if (catItems.length > 0) {
      const row = el("div", { className: "category-row" });
      row.append(el("h3", { className: "category-title" }, cat, el("span", {}, `(${catItems.length})`)));
      
      const itemsContainer = el("div", { className: "row-items" });
      catItems.forEach(i => itemsContainer.append(tile(i)));
      row.append(itemsContainer);
      board.append(row);
    }
  });

  $("count").textContent = list.length + (list.length === 1 ? " item" : " items");
}

function renderChips(){
  const defs = [{ id: "all", name: "All groups" }, ...groups.map((g) => ({ id: String(g.id), name: g.name }))];
  $("chips").replaceChildren(...defs.map(d => {
    const c = el("button", { className: "chip", type: "button" }, el("span", { className: "led" }), d.name);
    c.setAttribute("aria-pressed", String(state.group === d.id));
    c.addEventListener("click", () => { state.group = d.id; renderChips(); render(); });
    return c;
  }));
}

const dlg = $("dlg");
function openItem(i){
  $("d-pic").replaceChildren(i.image ? el("img", { src: i.image, alt: i.name }) : el("div"));
  $("d-name").textContent = i.name;
  const by = el("a", { href: "https://www.roblox.com/communities/" + i.groupId, target: "_blank", rel: "noopener", textContent: i.creator || i.groupName });
  $("d-by").replaceChildren("By ", by);
  $("d-price").textContent = priceText(i);
  $("d-fav").textContent = "★ " + Number(i.favorites).toLocaleString() + " favorites";
  $("d-desc").textContent = i.description || "No description available.";
  const buy = $("d-buy");
  buy.href = "https://www.roblox.com/catalog/" + i.id;
  buy.textContent = i.priceStatus === "Off Sale" ? "View on Roblox" : "Buy on Roblox";
  dlg.showModal();
}
$("d-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; render(); });

fetch("data.json").then(r => r.json()).then(data => {
  if (!data.groups.length) {
    $("sub").textContent = "No items yet";
    return;
  }
  build(data);
  $("sub").textContent = items.length + " items from " + groups.length + " groups";
  renderChips();
  render();
  if (data.updated) $("foot").textContent = "Updated " + new Date(data.updated).toLocaleString();
}).catch(() => {
  $("sub").textContent = "Could not load items";
});
</script>
</body>
</html>
